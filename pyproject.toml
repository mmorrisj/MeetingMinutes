[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetingminutes"
version = "0.1.0"
description = "Meeting-app-agnostic note taker: transcribes whatever audio plays through the system speakers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "soundcard>=0.4.3",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local, offline speech-to-text. Pulls in CTranslate2 + model download on first use.
whisper = ["faster-whisper>=1.0"]
# The FastAPI + Postgres/pgvector storage service.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
]
# Local ONNX embeddings for /search (no torch).
embed = ["fastembed>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5", "pgserver>=0.1.4"]

[project.scripts]
meetingminutes = "meetingminutes.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meetingminutes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
