[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetingminutes"
version = "0.1.0"
description = "Meeting-app-agnostic note taker: transcribes whatever audio plays through the system speakers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "soundcard>=0.4.3",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Local, offline speech-to-text. Pulls in CTranslate2 + model download on first use.
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
meetingminutes = "meetingminutes.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meetingminutes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
